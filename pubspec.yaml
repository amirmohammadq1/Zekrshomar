name: zekr_shomar
description: "برنامه ذکرشمار - شمارش صلوات و اذکار شیعی"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_native_splash: ^2.4.1
  vibration: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/splash.png

# تنظیمات اسپلش‌اسکرین (با دستور: dart run flutter_native_splash:create)
# از background_image استفاده می‌کنیم تا عکس splash.png کل صفحه (از بالا تا
# پایین، بدون حاشیه یا کادر رنگی) را پر کند، نه فقط مثل یک لوگوی کوچک وسط صفحه.
flutter_native_splash:
  color: "#000000"
  background_image: "assets/splash.png"
  android_12:
    # اندروید ۱۲ به بعد فقط اجازه‌ی نمایش یک آیکون کوچک وسط صفحه را می‌دهد
    # (محدودیت خود سیستم‌عامل است) نه تصویر تمام‌صفحه.
    image: assets/logo.png
    icon_background_color: "#000000"
    color: "#000000"
  android: true
  ios: false
  web: false
  fullscreen: true

# تنظیمات آیکون برنامه (با دستور: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
