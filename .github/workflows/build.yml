name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate native splash screen
        run: dart run flutter_native_splash:create

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Setup Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Create gradlew wrapper files
        working-directory: android
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin

      # ---- امضای برنامه برای انتشار در مایکت ----
      # این مرحله فقط زمانی فعال می‌شود که سکرت‌های زیر در گیت‌هاب تنظیم شده باشند:
      # KEYSTORE_BASE64 , KEYSTORE_PASSWORD , KEY_ALIAS , KEY_PASSWORD
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zekr-shomar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
